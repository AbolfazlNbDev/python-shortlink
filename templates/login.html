<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | اسموف</title>
    <link rel="stylesheet" href="/static/panel.css">
</head>
<body class="auth-body">
<div class="auth-card">
    <div class="logo">
        <img src="../static/images/logo.png" alt="">
    </div>
    <h2>ورود به حساب</h2>

    {% if error %}
    <div class="form-message error-message">{{ error }}</div>
    {% endif %}

    {% if success %}
    <div class="form-message success-message">{{ success }}</div>
    {% endif %}

    <form action="/login_user" method="post">
        <input type="email" name="email" placeholder="ایمیل" value="{{ old_email or '' }}">
        <input type="password" name="password" placeholder="رمز عبور">
        <button type="submit">ورود</button>
    </form>

    <p>حساب نداری؟ <a href="/register">ثبت نام کن</a></p>
    <p>رمز رو فراموش کردی؟ <a href="/change_password">بازیابی پسورد</a></p>
    <a class="back-home" href="/smoth">بازگشت به صفحه اصلی</a>
</div>
</body>
</html>
